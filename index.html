<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sukoon Playlist</title>
    <link rel="icon" type="image/webp" href="images/logo.webp">

   <style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;

    background-image: url("images/Desktop.webp");
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;

    overflow: hidden;
}

/* =========================
   MOBILE BACKGROUND
========================= */

@media (max-width: 768px) {
    body {
        background-image: url("images/Mobile.webp");
        background-position: center;
        background-size: cover;
    }
}


/* =========================
   PLAYER
========================= */

.player {
    position: fixed;

    left: 50%;
    bottom: 18px;

    transform: translateX(-50%);

    width: 430px;       /* reduced from 520px */
    height: 105px;      /* same height */

    padding: 10px 14px;

    display: flex;
    align-items: center;

    border-radius: 22px;

    background: rgba(40, 35, 45, 0.48);

    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);

    border: 1px solid rgba(255,255,255,0.25);

    box-shadow:
        0 8px 30px rgba(0,0,0,0.35),
        inset 0 1px 1px rgba(255,255,255,0.18);

    color: white;

    z-index: 1000;
}

/* =========================
   ALBUM IMAGE
========================= */

.album {

    width: 82px;
    height: 82px;

    flex-shrink: 0;

    border-radius: 14px;

    object-fit: cover;

    box-shadow:
        0 4px 15px rgba(0,0,0,0.35);
}


/* =========================
   RIGHT CONTENT
========================= */

.player-content {

    flex: 1;

    height: 100%;

    margin-left: 13px;

    display: flex;
    flex-direction: column;

    justify-content: center;

    min-width: 0;
}


/* =========================
   SONG NAME
========================= */

.song-name {

    font-size: 15px;

    font-weight: 600;

    line-height: 18px;

    white-space: nowrap;

    overflow: hidden;

    text-overflow: ellipsis;

    margin-bottom: 1px;
}


/* =========================
   ARTIST
========================= */

.artist {

    font-size: 11px;

    color: rgba(255,255,255,0.65);

    margin-bottom: 6px;
}


/* =========================
   PROGRESS
========================= */

.progress-row {

    display: flex;

    align-items: center;

    gap: 7px;

    width: 100%;
}


.time {

    font-size: 9px;

    color: rgba(255,255,255,0.65);

    width: 25px;
}


/* =========================
   PROGRESS BAR
========================= */

#progress {

    flex: 1;

    height: 3px;

    appearance: none;
    -webkit-appearance: none;

    border-radius: 10px;

    background: rgba(255,255,255,0.25);

    cursor: pointer;
}


#progress::-webkit-slider-thumb {

    appearance: none;
    -webkit-appearance: none;

    width: 9px;
    height: 9px;

    border-radius: 50%;

    background: white;

    cursor: pointer;
}


#progress::-moz-range-thumb {

    width: 9px;
    height: 9px;

    border: none;

    border-radius: 50%;

    background: white;

    cursor: pointer;
}


/* =========================
   CONTROLS
========================= */

.controls {

    display: flex;

    align-items: center;

    justify-content: center;

    gap: 22px;

    margin-top: 6px;
}


.control-btn {

    border: none;

    background: transparent;

    color: white;

    width: 25px;
    height: 25px;

    padding: 0;

    display: flex;

    align-items: center;

    justify-content: center;

    font-size: 17px;

    cursor: pointer;

    opacity: 0.9;

    transition: 0.15s;
}


.control-btn:hover {

    opacity: 1;

    transform: scale(1.08);
}


/* =========================
   PLAY BUTTON
========================= */

#playBtn {

    width: 32px;
    height: 32px;

    border-radius: 50%;

    background: rgba(255,255,255,0.85);

    color: #555;

    font-size: 14px;
}


/* =========================
   VOLUME
========================= */

.volume {

    display: flex;

    align-items: center;

    gap: 5px;

    margin-left: 5px;
}


.volume-icon {

    font-size: 15px;

    opacity: 0.9;
}


#volume {

    width: 55px;

    height: 3px;

    appearance: none;
    -webkit-appearance: none;

    border-radius: 10px;

    background: rgba(255,255,255,0.3);

    cursor: pointer;
}


#volume::-webkit-slider-thumb {

    appearance: none;
    -webkit-appearance: none;

    width: 8px;
    height: 8px;

    border-radius: 50%;

    background: white;
}


#volume::-moz-range-thumb {

    width: 8px;
    height: 8px;

    border: none;

    border-radius: 50%;

    background: white;
}


/* =========================
   MOBILE
========================= */

@media (max-width: 600px) {
    body {
        background-image: url("images/Mobile.webp");
        background-position: center;
        background-size: cover;
    }
    .player {
        width: 80vw;       /* 80% of phone screen width */
        height: 82px;      /* DO NOT CHANGE HEIGHT */

        bottom: 12px;

        padding: 7px 10px;

        border-radius: 17px;
    }

    .album {
        width: 64px;
        height: 64px;

        border-radius: 10px;
    }

    .player-content {
        margin-left: 10px;
    }

    .song-name {
        font-size: 13px;
        line-height: 15px;
    }

    .artist {
        font-size: 9px;
        margin-bottom: 4px;
    }

    .controls {
        gap: 16px;
        margin-top: 4px;
    }

    .control-btn {
        font-size: 14px;
        width: 22px;
        height: 22px;
    }

    #playBtn {
        width: 27px;
        height: 27px;
        font-size: 12px;
    }

    .volume {
        margin-left: 2px;
    }

    #volume {
        width: 40px;
    }
}
</style>


</head>


<body>


    <!-- =========================
         MUSIC PLAYER
    ========================= -->


<!-- =========================
     MUSIC PLAYER
========================= -->

<div class="player">

    <!-- Album -->
    <img
        class="album"
        src="images/Desktop.webp"
        alt="Album"
    >


    <!-- Player Content -->
    <div class="player-content">

        <!-- Song -->
        <div
            class="song-name"
            id="songName">
            Loading...
        </div>

        <!-- Progress -->
        <div class="progress-row">

            <span
                class="time"
                id="currentTime">
                0:00
            </span>


            <input
                type="range"
                id="progress"
                min="0"
                max="100"
                value="0"
            >


            <span
                class="time"
                id="duration">
                0:00
            </span>

        </div>


        <!-- Controls -->
        <div class="controls">

            <button
                class="control-btn"
                id="prevBtn">
                ⏮
            </button>


            <button
                class="control-btn"
                id="playBtn">
                ▶
            </button>


            <button
                class="control-btn"
                id="nextBtn">
                ⏭
            </button>


            <div class="volume">

                <span class="volume-icon">
                    🔊
                </span>

                <input
                    type="range"
                    id="volume"
                    min="0"
                    max="1"
                    step="0.01"
                    value="1"
                >

            </div>

        </div>

    </div>


    <!-- Audio engine -->
    <audio id="audioPlayer" preload="metadata"></audio>

</div>

    <script>

        /* =========================
           SONG LIST
        ========================= */

        const songs = [

            {
                name: "Kangna Tera Ni",
                file: "songs/Kangna_Tera_Ni.mp3"
            },

            {
                name: "Lag Jaa Gale",
                file: "songs/Lag_Jaa_Gale.mp3"
            },
            {
                name: "Chand Ko Utray",
                file: "songs/Chand_Ko_Utray.mp3"
            },
            {
                name: "Un Ke Andaz-E-Karam",
                file: "songs/Un_Ka_Andaz.mp3"
            }

        ];


        /* =========================
           VARIABLES
        ========================= */

        let currentSong = 0;


        const audioPlayer =
            document.getElementById("audioPlayer");

        const songName =
            document.getElementById("songName");

        const playBtn =
            document.getElementById("playBtn");

        const prevBtn =
            document.getElementById("prevBtn");

        const nextBtn =
            document.getElementById("nextBtn");

        const progress =
            document.getElementById("progress");

        const volume =
            document.getElementById("volume");

        const currentTime =
            document.getElementById("currentTime");

        const duration =
            document.getElementById("duration");


        /* =========================
           LOAD SONG
        ========================= */

        function loadSong(index) {

            currentSong = index;

            audioPlayer.src =
                songs[currentSong].file;

            songName.textContent =
                songs[currentSong].name;

            progress.value = 0;

            currentTime.textContent = "0:00";
        }


        /* =========================
           PLAY / PAUSE
        ========================= */

        playBtn.addEventListener("click", function () {

            if (audioPlayer.paused) {

                audioPlayer.play();

                playBtn.textContent = "⏸";

            } else {

                audioPlayer.pause();

                playBtn.textContent = "▶";
            }

        });


        /* =========================
           NEXT SONG
        ========================= */

        nextBtn.addEventListener("click", function () {

            currentSong++;

            if (currentSong >= songs.length) {

                currentSong = 0;
            }

            loadSong(currentSong);

            audioPlayer.play();

            playBtn.textContent = "⏸";

        });


        /* =========================
           PREVIOUS SONG
        ========================= */

        prevBtn.addEventListener("click", function () {

            currentSong--;

            if (currentSong < 0) {

                currentSong = songs.length - 1;
            }

            loadSong(currentSong);

            audioPlayer.play();

            playBtn.textContent = "⏸";

        });


        /* =========================
           SONG ENDED
        ========================= */

        audioPlayer.addEventListener("ended", function () {

            currentSong = Math.floor(Math.random() * songs.length);

            if (currentSong >= songs.length) {

                currentSong = 0;
            }

            loadSong(currentSong);

            audioPlayer.play();

            playBtn.textContent = "⏸";

        });


        /* =========================
           UPDATE PROGRESS
        ========================= */

        audioPlayer.addEventListener("timeupdate", function () {

            if (audioPlayer.duration) {

                const percentage =
                    (audioPlayer.currentTime /
                    audioPlayer.duration) * 100;

                progress.value = percentage;
            }


            currentTime.textContent =
                formatTime(audioPlayer.currentTime);

        });


        /* =========================
           DURATION
        ========================= */

        audioPlayer.addEventListener("loadedmetadata", function () {

            duration.textContent =
                formatTime(audioPlayer.duration);

        });


        /* =========================
           SEEK SONG
        ========================= */

        progress.addEventListener("input", function () {

            if (audioPlayer.duration) {

                audioPlayer.currentTime =
                    (progress.value / 100) *
                    audioPlayer.duration;
            }

        });


        /* =========================
           VOLUME
        ========================= */

        volume.addEventListener("input", function () {

            audioPlayer.volume =
                volume.value;

        });


        /* =========================
           PLAY STATE
        ========================= */

        audioPlayer.addEventListener("play", function () {

            playBtn.textContent = "⏸";

        });


        audioPlayer.addEventListener("pause", function () {

            playBtn.textContent = "▶";

        });


        /* =========================
           TIME FORMAT
        ========================= */

        function formatTime(seconds) {

            if (isNaN(seconds)) {

                return "0:00";
            }

            const minutes =
                Math.floor(seconds / 60);

            const secs =
                Math.floor(seconds % 60);

            return minutes + ":" +
                (secs < 10 ? "0" : "") +
                secs;
        }


        /* =========================
           FIRST SONG
        ========================= */

        loadSong(Math.floor(Math.random() * songs.length));

    </script>

</body>

</html>
